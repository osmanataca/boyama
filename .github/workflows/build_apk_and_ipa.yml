name: Build Android (.apk) & iOS (.ipa) Packages

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: "Android .APK Paketi Oluştur (Ayşe'nin Resim Atölyesi)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Public Maven Gradle Config for GitHub Runner
        run: |
          cat << 'TOMLEOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.7.3"
          coreKtx = "1.15.0"
          junit = "4.13.2"
          junitVersion = "1.2.1"
          espressoCore = "3.6.1"
          lifecycleRuntimeKtx = "2.8.7"
          lifecycleViewmodelCompose = "2.8.7"
          lifecycleRuntimeCompose = "2.8.7"
          activityCompose = "1.9.3"
          kotlin = "2.0.21"
          composeBom = "2024.09.00"
          googleDevtoolsKsp = "2.0.21-1.0.28"
          navigationCompose = "2.8.4"
          roomRuntime = "2.6.1"
          roomKtx = "2.6.1"
          roomCompiler = "2.6.1"
          kotlinxCoroutinesTest = "1.9.0"
          core = "1.6.1"
          runner = "1.6.2"
          kotlinxCoroutinesAndroid = "1.9.0"
          kotlinxCoroutinesCore = "1.9.0"
          robolectric = "4.13"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
          androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
          androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
          robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "googleDevtoolsKsp" }
          TOMLEOF

          cat << 'ROOTEOF' > build.gradle.kts
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
          }
          ROOTEOF

          cat << 'APPEOF' > app/build.gradle.kts
          plugins {
            alias(libs.plugins.android.application)
            alias(libs.plugins.kotlin.android)
            alias(libs.plugins.kotlin.compose)
            alias(libs.plugins.google.devtools.ksp)
          }

          android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
              applicationId = "com.aistudio.renkatolyesi.qxmpvk"
              minSdk = 24
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"
            }

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_11
              targetCompatibility = JavaVersion.VERSION_11
            }
            kotlinOptions {
              jvmTarget = "11"
            }
            buildFeatures {
              compose = true
              buildConfig = true
            }
          }

          dependencies {
            implementation(platform(libs.androidx.compose.bom))
            implementation(libs.androidx.activity.compose)
            implementation(libs.androidx.compose.material.icons.core)
            implementation(libs.androidx.compose.material.icons.extended)
            implementation(libs.androidx.compose.material3)
            implementation(libs.androidx.compose.ui)
            implementation(libs.androidx.compose.ui.graphics)
            implementation(libs.androidx.compose.ui.tooling.preview)
            implementation(libs.androidx.core.ktx)
            implementation(libs.androidx.lifecycle.runtime.compose)
            implementation(libs.androidx.lifecycle.runtime.ktx)
            implementation(libs.androidx.lifecycle.viewmodel.compose)
            implementation(libs.androidx.room.ktx)
            implementation(libs.androidx.room.runtime)
            implementation(libs.kotlinx.coroutines.android)
            implementation(libs.kotlinx.coroutines.core)
            "ksp"(libs.androidx.room.compiler)
          }
          APPEOF

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Signed Debug APK
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Aysenin_Resim_Atolyesi.apk
          ls -lh Aysenin_Resim_Atolyesi.apk

      - name: Upload Android .APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aysenin-Resim-Atolyesi-Android-APK
          path: Aysenin_Resim_Atolyesi.apk
