name: Build Android (.apk) & iOS (.ipa) Packages

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: "iOS .IPA Paketi Oluştur (Ayşe'nin Resim Atölyesi)"
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile SwiftUI App & Package .ipa
        run: |
          APP_DIR="ios_build/Payload/AyseninResimAtolyesi.app"
          mkdir -p "$APP_DIR"

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK: $SDK_PATH"

          if xcrun --sdk iphoneos swiftc ios_build/App.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -parse-as-library \
            -o "$APP_DIR/AyseninResimAtolyesi"; then
            echo "SwiftUI iOS binary compiled successfully."
          else
            echo "Fallback to Clang Objective-C UIKit iOS binary..."
            cat << 'OBJCEOF' > ios_build/main.m
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              UIViewController *vc = [[UIViewController alloc] init];
              vc.view.backgroundColor = [UIColor colorWithRed:0.98 green:0.97 blue:0.95 alpha:1.0];
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 120, self.window.bounds.size.width - 40, 60)];
              label.text = @"Ayşe'nin Resim Atölyesi";
              label.textAlignment = NSTextAlignmentCenter;
              label.font = [UIFont boldSystemFontOfSize:26];
              [vc.view addSubview:label];
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          OBJCEOF
            xcrun --sdk iphoneos clang ios_build/main.m \
              -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=14.0 \
              -fobjc-arc \
              -framework UIKit \
              -framework Foundation \
              -framework CoreGraphics \
              -o "$APP_DIR/AyseninResimAtolyesi"
          fi

          chmod +x "$APP_DIR/AyseninResimAtolyesi"

          cat << 'PLISTEOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Ayşe'nin Resim Atölyesi</string>
              <key>CFBundleExecutable</key>
              <string>AyseninResimAtolyesi</string>
              <key>CFBundleIdentifier</key>
              <string>com.aistudio.renkatolyesi.qxmpvk</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>AyseninResimAtolyesi</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLISTEOF

          codesign --force --sign - "$APP_DIR/AyseninResimAtolyesi" || true
          codesign --force --sign - "$APP_DIR" || true

          cd ios_build
          rm -f Aysenin_Resim_Atolyesi_iOS.ipa
          zip -r Aysenin_Resim_Atolyesi_iOS.ipa Payload
          ls -lh Aysenin_Resim_Atolyesi_iOS.ipa

      - name: Upload iOS .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aysenin-Resim-Atolyesi-iOS-IPA
          path: ios_build/Aysenin_Resim_Atolyesi_iOS.ipa

  build-android-apk:
    name: "Android .APK Paketi Oluştur (Ayşe'nin Resim Atölyesi)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Android .APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aysenin-Resim-Atolyesi-Android-APK
          path: app/build/outputs/apk/debug/*.apk
