name: Build Android (.apk) & iOS (.ipa) Packages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: "Android APK Oluştur (Ayşe'nin Resim Atölyesi)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aysenin-Resim-Atolyesi-Android-APK
          path: app/build/outputs/apk/debug/*.apk

  build-ios-ipa:
    name: "iOS IPA Oluştur (macOS Xcode Runner)"
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate iOS App Bundle & Unsigned IPA (Sideloadly / AltStore / Xcode)
        run: |
          mkdir -p ios_build/Payload
          cat << 'EOF' > ios_build/Main.swift
          import SwiftUI
          import WebKit

          @main
          struct AyseninResimAtolyesiApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .ignoresSafeArea()
                  }
              }
          }

          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 16) {
                      Text("Ayşe'nin Resim Atölyesi")
                          .font(.system(size: 28, weight: .bold, design: .rounded))
                      Text("iOS Sürümü Hazır")
                          .font(.subheadline)
                  }
              }
          }
          EOF

          APP_DIR="ios_build/Payload/AyseninResimAtolyesi.app"
          mkdir -p "$APP_DIR"

          xcrun --sdk iphoneos swiftc ios_build/Main.swift \
            -target arm64-apple-ios16.0 \
            -o "$APP_DIR/AyseninResimAtolyesi"

          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Ayşe'nin Resim Atölyesi</string>
              <key>CFBundleExecutable</key>
              <string>AyseninResimAtolyesi</string>
              <key>CFBundleIdentifier</key>
              <string>com.aistudio.renkatolyesi.qxmpvk</string>
              <key>CFBundleName</key>
              <string>AyseninResimAtolyesi</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          cd ios_build
          zip -r Aysenin_Resim_Atolyesi_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aysenin-Resim-Atolyesi-iOS-IPA
          path: ios_build/Aysenin_Resim_Atolyesi_iOS.ipa
